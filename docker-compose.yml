# Layanan pendukung untuk pengembangan lokal NSCAS.
# Kredensial di bawah hanya untuk laptop pengembang dan dapat ditimpa melalui .env.
# Produksi memakai docker-compose.prod.yml (Fase 16), bukan berkas ini.

name: nscas

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nscas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nscas_dev}
      POSTGRES_DB: ${POSTGRES_DB:-nscas}
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nscas} -d ${POSTGRES_DB:-nscas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Citra resmi minio/minio tidak lagi diterbitkan di Docker Hub.
  # pgsty/minio adalah fork komunitas MinIO yang tetap dirawat dan kompatibel S3.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nscas}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nscas_dev_secret}
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # konsol web
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Membuat bucket sekali saat pertama dijalankan, lalu berhenti.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc anonymous set none local/$${S3_BUCKET}
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nscas}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nscas_dev_secret}
      S3_BUCKET: ${S3_BUCKET:-nscas-dev}
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # antarmuka web
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      TZ: Asia/Jakarta

volumes:
  pgdata:
  miniodata:
